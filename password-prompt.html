<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'self'">
  <title>password prompt</title>
  <style>
    :root{--bg:#fff;--text:#202124;--muted:#71757c;--hover:#2021240b;--accent:#e43d46;--accent-fg:#e43d46;--on-accent:#fff;--accent-soft:#e43d461f;--border:#dfe2e7}
    @media (prefers-color-scheme:dark){:root{--bg:#292c31;--text:#f3f4f6;--muted:#a9adb5;--hover:#ffffff12;--accent:#ff5a62;--accent-fg:#ff5a62;--on-accent:#fff;--accent-soft:#ff5a6220;--border:#3b3f46}}
    html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    body{box-sizing:border-box;padding:12px}
    .card{position:relative;box-sizing:border-box;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:0 3px 10px #0003;padding:14px 16px;display:flex;flex-direction:column;animation:popIn .16s cubic-bezier(.2,.9,.25,1)}
    @keyframes popIn{from{opacity:0;transform:scale(.96) translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.card{animation:none}}
    .t{font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
    .t svg{width:16px;height:16px;color:var(--accent-fg);flex:0 0 auto}
    .host{margin-top:8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .u{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:auto}
    button{border:0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;color:inherit}
    #no{background:var(--hover);color:var(--text)}
    #no:hover{background:var(--border)}
    #yes{background:var(--accent);color:var(--on-accent)}
    #yes:hover{filter:brightness(.92)}
    button:focus-visible{outline:2px solid var(--accent-fg);outline-offset:-2px}
    #x{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0;background:transparent}
    #x:hover{background:var(--accent-soft);color:var(--accent-fg)}
    #x svg{width:12px;height:12px;display:block}
    #accounts{display:flex;flex-direction:column;gap:4px;margin-top:10px;overflow-y:auto}
    #accounts::-webkit-scrollbar{width:0}
    .acc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left;background:transparent}
    .acc:hover{background:var(--hover)}
    .acc .ava{display:grid;place-items:center;width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-fg);font-weight:700;font-size:12px;text-transform:uppercase}
    .acc .who{min-width:0}
    .acc .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .acc .who small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #login input{margin-top:8px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;width:100%;box-sizing:border-box}
    #login input:focus{outline:none;border-color:var(--accent-fg)}
  </style>
</head>
<body>
  <div class="card">
  <button id="x" title="Закрыть" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  <div id="save" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 13L20 4"/><path d="M16 8l3 3"/></svg><span id="saveTitle">Сохранить пароль?</span></div>
    <div class="host" id="host"></div>
    <div class="u" id="user"></div>
    <div class="u" id="pass"></div>
  </div>
  <div id="choose" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 13L20 4"/><path d="M16 8l3 3"/></svg><span id="chooseTitle">Выберите аккаунт</span></div>
    <div id="accounts"></div>
  </div>
  <div id="login" style="display:none;flex-direction:column;flex:1;min-height:0">
    <div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="loginTitle">Требуется авторизация</span></div>
    <div class="host" id="loginHost"></div>
    <input id="loginUser" autocomplete="off" spellcheck="false" placeholder="Логин">
    <input id="loginPass" type="password" placeholder="Пароль">
  </div>
  <div class="btns"><button id="no">Не сейчас</button><button id="yes">Сохранить</button></div>
  </div>
<script src="i18n.js"></script>
<script src="popup-common.js"></script>
<script>
const esc=popupEsc;
let mode='save';
pw.onState(p=>{
  const card=document.querySelector('.card');popupRepop(card);
  popupApplyTheme(p);
  const tt=popupT(p);
  document.getElementById('saveTitle').textContent=tt('savePasswordQ');
  document.getElementById('chooseTitle').textContent=tt('selectAccount');
  mode=p.mode==='choose'?'choose':p.mode==='login'?'login':'save';
  document.getElementById('save').style.display=mode==='save'?'flex':'none';
  document.getElementById('choose').style.display=mode==='choose'?'flex':'none';
  document.getElementById('login').style.display=mode==='login'?'flex':'none';
  document.querySelector('.btns').style.display=mode==='choose'?'none':'flex';
  if(mode==='login'){
    document.getElementById('loginTitle').textContent=tt('loginRequired');
    document.getElementById('loginHost').textContent=p.host||'';
    document.getElementById('loginUser').placeholder=tt('login');
    document.getElementById('loginPass').placeholder=tt('password');
    document.getElementById('no').textContent=tt('cancel');
    document.getElementById('yes').textContent=tt('loginBtn');
    setTimeout(()=>document.getElementById('loginUser').focus(),50);
    return;
  }
  document.getElementById('no').textContent=tt('notNow');
  document.getElementById('yes').textContent=tt('save');
  const x=document.getElementById('x'); x.title=tt('closeBtn'); x.setAttribute('aria-label',tt('closeBtn'));
  if(mode==='choose'){
    document.getElementById('accounts').innerHTML=(p.accounts||[]).map(a=>`<button class="acc" data-id="${a.id}"><span class="ava">${esc((a.username||a.host||'?')[0]||'?')}</span><span class="who"><b>${esc(a.username||tt('noLogin'))}</b><small>${esc(a.host)}</small></span></button>`).join('');
    document.querySelectorAll('.acc').forEach(b=>b.onclick=()=>pw.choose(b.dataset.id));
  } else {
    document.getElementById('host').textContent=p.host||'';
    document.getElementById('user').textContent=p.username||tt('noLogin');
    document.getElementById('pass').textContent=p.passLen?tt('passwordLabel')+' '+'•'.repeat(Math.min(p.passLen,14)):'';
  }
});
const answerNo=()=>{if(mode==='login')pw.loginAnswer(null);else pw.answer(false)};
document.getElementById('yes').onclick=()=>{if(mode==='login')pw.loginAnswer({u:document.getElementById('loginUser').value,p:document.getElementById('loginPass').value});else pw.answer(true)};
document.getElementById('no').onclick=answerNo;
document.getElementById('x').onclick=answerNo;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')answerNo();
  else if(e.key==='Enter'){if(mode==='choose'){const b=document.querySelector('.acc');if(b)b.click()}else document.getElementById('yes').click()}
});
pw.ready();
</script>
</body>
</html>
