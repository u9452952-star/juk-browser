<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self'; script-src 'self'">
  <title>Juk Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="chrome">
    <div id="titlebar">
      <div class="juk-mark" title="Juk Browser" aria-hidden="true">J</div>
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon" data-i18n-title="newTab" title="Новая вкладка (Ctrl+T)" data-i18n-aria="newTab" aria-label="Новая вкладка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <div id="titlebar-drag-space" aria-hidden="true"></div>
      <div id="incognito-badge" data-i18n-title="incognitoNote" title="Окно инкогнито — история, cookies и загрузки не сохраняются" data-i18n-aria="incognitoNote" aria-label="Окно инкогнито"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h17l-1.6 2.8H5.1L3.5 9.5z"/><path d="M8 9.3c0-2.9 1.7-4.8 4-4.8s4 1.9 4 4.8"/><circle cx="8.2" cy="16.6" r="2.4"/><circle cx="15.8" cy="16.6" r="2.4"/><path d="M10.6 16.6h2.8"/></svg></div>
      <div class="window-controls">
        <button data-window="minimize" class="minimize" data-i18n-title="minimize" title="Свернуть" data-i18n-aria="minimize" aria-label="Свернуть"><span class="caption-icon" aria-hidden="true"></span></button>
        <button data-window="maximize" class="maximize" data-i18n-title="maximize" title="Развернуть" data-i18n-aria="maximize" aria-label="Развернуть"><span class="caption-icon" aria-hidden="true"></span></button>
        <button data-window="close" class="close" data-i18n-title="close" title="Закрыть" data-i18n-aria="close" aria-label="Закрыть"><span class="caption-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div id="toolbar">
      <div class="nav-cluster" aria-label="Навигация">
        <button id="back" class="icon" data-i18n-title="back" title="Назад (Alt+←)" data-i18n-aria="back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
        <button id="forward" class="icon" data-i18n-title="forward" title="Вперёд (Alt+→)" data-i18n-aria="forward" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg></button>
      </div>
      <button id="reload" class="icon reload-control" data-i18n-title="reload" title="Обновить (Ctrl+R)" data-i18n-aria="reload" aria-label="Обновить"></button>
      <button id="home" class="icon" data-i18n-title="home" title="Домой" data-i18n-aria="home" aria-label="Домой"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 21v-9h6v9"/></svg></button>
      <div id="omnibox-wrap">
        <span id="security" data-i18n-title="securityInfo" title="Сведения о сайте"></span>
        <img id="page-favicon" alt="">
        <input id="omnibox" autocomplete="off" spellcheck="false" data-i18n-aria="searchOrAddress" aria-label="Адресная строка" data-i18n-ph="searchOrAddress" placeholder="Поиск в интернете или адрес">
        <button id="bookmark" data-i18n-title="bookmarkStar" title="Добавить закладку" data-i18n-aria="bookmarkStar" aria-label="Добавить закладку"></button>
      </div>
      <div class="toolbar-actions">
        <button id="downloads-button" class="icon" data-i18n-title="downloads" title="Загрузки (Ctrl+J)" data-i18n-aria="downloads" aria-label="Загрузки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
        <button id="menu" class="icon menu-button" data-i18n-title="settingsBtn" title="Настройка и управление" data-i18n-aria="settingsBtn" aria-label="Настройка и управление"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>
    </div>
    <div id="bookmarks-bar"></div>
    <div id="progress"></div>
    <div id="findbar" class="hidden">
      <div id="findbar-card">
        <input id="find-input" data-i18n-ph="findPlaceholder" placeholder="Найти на странице" data-i18n-aria="findPlaceholder" aria-label="Найти на странице" spellcheck="false" autocomplete="off">
        <span id="find-count"></span>
        <button id="find-prev" class="icon" data-i18n-title="findPrev" title="Предыдущее" data-i18n-aria="findPrev" aria-label="Предыдущее"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg></button>
        <button id="find-next" class="icon" data-i18n-title="findNext" title="Следующее" data-i18n-aria="findNext" aria-label="Следующее"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg></button>
        <button id="find-close" class="icon" data-i18n-title="closeBtn" title="Закрыть" data-i18n-aria="closeBtn" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
    </div>
  </header>

  <main id="bookmarks-page" class="hidden">
    <div id="bookmarks-inner">
      <div class="history-head"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l2.95 5.97 6.6.96-4.78 4.66 1.13 6.58L12 17.57l-5.9 3.1 1.13-6.58L2.45 9.43l6.6-.96z"/></svg><span data-i18n="bookmarks">Закладки</span></h1></div>
      <div class="history-tools"><input id="bm-search" data-i18n-ph="searchBookmarks" placeholder="Поиск в закладках" spellcheck="false"></div>
      <div id="bm-list"></div>
    </div>
  </main>

  <main id="settings-page" class="hidden">
    <aside id="settings-nav">
      <div class="settings-brand"><div class="juk-mark" aria-hidden="true">J</div><span data-i18n="settings">Настройки</span></div>
      <button data-section="appearance" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg><span data-i18n="appearance">Внешний вид</span></button>
      <button data-section="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><span data-i18n="searchEngine">Поисковая система</span></button>
      <button data-section="startup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.36 6.64a9 9 0 1 1-12.72 0"/><path d="M12 2v9"/></svg><span data-i18n="startup">Запуск</span></button>
      <button data-section="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-i18n="privacy">Конфиденциальность</span></button>
      <button data-section="downloads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="downloadsSection">Загрузки</span></button>
      <button data-section="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4.5"/><path d="M12 7.6h.01"/></svg><span data-i18n="about">О браузере</span></button>
    </aside>
    <div id="settings-scroll"><div id="settings-content"></div></div>
  </main>

  <main id="history-page" class="hidden">
    <div id="history-inner">
      <div class="history-head"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span data-i18n="history">История</span></h1></div>
      <div class="history-tools"><input id="history-search" data-i18n-ph="searchHistory" placeholder="Поиск в истории" spellcheck="false"><select id="history-range"><option value="3600000" data-i18n="rangeHour">За час</option><option value="86400000" data-i18n="rangeDay">За 24 часа</option><option value="0" selected data-i18n="rangeAll">За всё время</option></select><button class="danger" id="history-clear" data-i18n="clear">Очистить</button></div>
      <div id="history-list"></div>
    </div>
  </main>

  <main id="downloads-page" class="hidden">
    <div id="downloads-inner">
      <div class="history-head"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="downloadsSection">Загрузки</span></h1><button class="ghost" id="downloads-clear" data-i18n="clearList">Очистить список</button></div>
      <div id="downloads-list"></div>
    </div>
  </main>

  <main id="newtab-page" class="hidden">
    <div id="newtab-inner">
      <div id="nt-clock">--:--</div>
      <div id="nt-date"></div>
      <div id="newtab-search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg><input id="newtab-search" data-i18n-ph="searchOrAddress" placeholder="Поиск в интернете или адрес" spellcheck="false" autocomplete="off"></div>
      <div id="newtab-tiles"></div>
      <div id="newtab-links">
        <button data-nl="juk://history" data-i18n="history">История</button>
        <button data-nl="juk://bookmarks" data-i18n="bookmarks">Закладки</button>
        <button data-nl="juk://downloads" data-i18n="downloads">Загрузки</button>
        <button data-nl="juk://passwords" data-i18n="passwords">Пароли</button>
        <button data-nl="juk://settings" data-i18n="settings">Настройки</button>
      </div>
      <button id="nt-cfg-btn" data-i18n-title="customizeStart" title="Настроить начальный экран" data-i18n-aria="customizeStart" aria-label="Настроить начальный экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/></svg></button>
      <div id="nt-cfg" class="hidden">
        <div class="nt-cfg-title" data-i18n="customizeStart">Начальный экран</div>
        <div class="nt-cfg-row"><span data-i18n="showClock">Часы и дата</span><label class="switch"><input type="checkbox" id="nt-cfg-clock"><span class="slider"></span></label></div>
        <div class="nt-cfg-row"><span data-i18n="showSearch">Поиск</span><label class="switch"><input type="checkbox" id="nt-cfg-search"><span class="slider"></span></label></div>
        <div class="nt-cfg-row"><span data-i18n="showTiles">Плитки сайтов</span><label class="switch"><input type="checkbox" id="nt-cfg-tiles"><span class="slider"></span></label></div>
        <div class="nt-cfg-row"><span data-i18n="showLinks">Быстрые ссылки</span><label class="switch"><input type="checkbox" id="nt-cfg-links"><span class="slider"></span></label></div>
        <div class="nt-cfg-row"><span data-i18n="showBg">Фоновая подсветка</span><label class="switch"><input type="checkbox" id="nt-cfg-bg"><span class="slider"></span></label></div>
        <div class="nt-cfg-row"><span data-i18n="wallpaper">Обои</span><div class="nt-cfg-wp"><button class="ghost" id="nt-cfg-wp" data-i18n="chooseWallpaper">Выбрать…</button><button class="ghost" id="nt-cfg-wp-clear" data-i18n-title="removeWallpaper" title="Убрать обои" aria-label="Убрать обои"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div></div>
      </div>
    </div>
  </main>

  <main id="passwords-page" class="hidden">
    <div id="passwords-inner">
      <div class="history-head"><h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 13L20 4"/><path d="M16 8l3 3"/></svg><span data-i18n="passwords">Пароли</span></h1></div>
      <div class="history-tools"><input id="pw-search" data-i18n-ph="searchPasswords" placeholder="Поиск по сайтам и логинам" spellcheck="false"></div>
      <div class="pw-add"><input id="pw-add-site" data-i18n-ph="site" placeholder="Сайт (example.com)" spellcheck="false"><input id="pw-add-login" data-i18n-ph="login" placeholder="Логин" spellcheck="false"><input id="pw-add-pass" type="password" data-i18n-ph="password" placeholder="Пароль"><button class="primary" id="pw-add-btn" data-i18n="add">Добавить</button></div>
      <div id="pw-list"></div>
    </div>
  </main>

  <div id="nt-modal" class="hidden">
    <div id="nt-modal-card" role="dialog" aria-modal="true" aria-labelledby="nt-modal-title">
      <div id="nt-modal-title" data-i18n="addTileTitle">Добавить сайт</div>
      <input id="nt-url" data-i18n-ph="tileUrl" placeholder="Адрес сайта (example.com)" spellcheck="false" autocomplete="off">
      <input id="nt-title" data-i18n-ph="tileName" placeholder="Название (необязательно)" spellcheck="false" autocomplete="off">
      <div class="nt-modal-actions"><button class="ghost" id="nt-cancel" data-i18n="cancel">Отмена</button><button class="primary" id="nt-save" data-i18n="add">Добавить</button></div>
    </div>
  </div>

  <div id="crash-overlay" class="hidden">
    <div id="crash-card" role="alertdialog" aria-modal="true" aria-labelledby="crash-title">
      <div class="overlay-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.3 9.3l2.2 2.2M10.5 9.3l-2.2 2.2M13.5 9.3l2.2 2.2M15.7 9.3l-2.2 2.2"/><path d="M8.3 16.6c1.05-1.05 2.3-1.6 3.7-1.6s2.65.55 3.7 1.6"/></svg></div>
      <div id="crash-title" class="overlay-title"></div>
      <div class="overlay-hint" data-i18n="crashHint">Страница была завершена из-за ошибки или нехватки памяти</div>
      <div class="overlay-actions"><button class="ghost hidden" id="crash-wait" data-i18n="waitBtn">Подождать</button><button class="primary" id="crash-reload" data-i18n="reload">Обновить</button></div>
    </div>
  </div>

  <div id="cert-overlay" class="hidden">
    <div id="cert-card" role="alertdialog" aria-modal="true" aria-labelledby="cert-title">
      <div class="overlay-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M12 15v2.5"/></svg></div>
      <div id="cert-title" class="overlay-title" data-i18n="certErrorTitle">Соединение не защищено</div>
      <div class="overlay-hint" id="cert-desc"></div>
      <div id="cert-code"></div>
      <div class="overlay-actions"><button class="ghost" id="cert-back" data-i18n="back">Назад</button><button class="danger" id="cert-proceed" data-i18n="certProceed">Всё равно перейти</button></div>
    </div>
  </div>

  <div id="confirm-overlay" class="hidden">
    <div id="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-text">
      <div id="confirm-text"></div>
      <div id="confirm-actions"><button id="confirm-cancel" data-i18n="cancel">Отмена</button><button id="confirm-ok" class="danger" data-i18n="delete">Удалить</button></div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
